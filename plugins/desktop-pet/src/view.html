<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Harness 桌宠</title><style>#bubble .bubble-aside{color:#948b81}</style>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none}#stage{width:100%;height:100%;touch-action:none}canvas{display:block;width:100%;height:100%}#message{position:absolute;left:8px;right:8px;bottom:12px;background:#fffffff0;color:#34415c;border:1px solid #dbe2ef;border-radius:12px;padding:12px;font:13px/1.6 -apple-system,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}#message:empty{display:none}</style></head>
<body><style>#bubble{position:absolute;top:8px;left:12px;right:12px;width:fit-content;max-width:calc(100% - 48px);margin:auto;padding:9px 13px;border-radius:14px;background:#fffcf6ed;border:1px solid #e4d8ca;color:#534636;font:13px/1.5 -apple-system,sans-serif;pointer-events:none;box-shadow:0 3px 12px #30201014}#bubble:empty{display:none}#menu{position:absolute;z-index:3;width:164px;padding:6px;border-radius:12px;background:#fffcf8f5;box-shadow:0 8px 25px #0003;border:1px solid #dfd9ce}#menu button{display:block;width:100%;padding:9px;text-align:left;border:0;background:none;border-radius:7px;font:13px -apple-system,sans-serif;color:#443f37;cursor:pointer}#menu button:hover{background:#eee4d5}</style><style>.chat-open #stage{height:calc(100% - 72px)}#pet-chat{position:absolute;bottom:8px;left:8px;right:8px;height:56px;display:flex;gap:6px;padding:6px;box-sizing:border-box;border:1px solid #e4d8ca;border-radius:14px;background:#fffcf8f5;box-shadow:0 4px 16px #0002;z-index:2}#pet-chat[hidden]{display:none}#pet-input{min-width:0;flex:1;resize:none;border:0;background:transparent;padding:8px;font:13px/1.5 -apple-system,sans-serif;user-select:text;outline:none}#pet-chat button{border:0;border-radius:9px;padding:0 12px;background:#526fa5;color:white;cursor:pointer}#pet-chat button:disabled{opacity:.5}#bubble{max-height:38%;overflow:auto;overflow-wrap:anywhere;white-space:pre-wrap}</style><div id="stage"></div><form id="pet-chat" hidden><textarea id="pet-input" rows="1" maxlength="8000" aria-label="对伙伴说" placeholder="想聊些什么？"></textarea><button type="submit">发送</button></form><div id="bubble" role="status"></div><div id="message" role="alert"></div><div id="menu" hidden><button data-action="chat">聊天</button><button data-action="touch">摸摸头</button><button data-action="click">打个招呼</button><button data-action="annoyed">逗一下</button><button data-action="settings">换角色 / 设置</button><button data-action="hide">暂时隐藏</button></div><script type="module" src="/desktop-pet/view.js"></script></body></html>
