<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伙伴聊天</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#333d4b;font:14px -apple-system,BlinkMacSystemFont,sans-serif;height:100vh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #e7e4df}header strong{flex:1}button,textarea{font:inherit}button{border:1px solid #dcdfe5;border-radius:9px;background:white;color:inherit;padding:8px 12px;cursor:pointer}button:disabled{opacity:.5;cursor:default}#messages{padding:18px;overflow:auto;flex:1;min-height:0}.message{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;border-radius:14px;padding:12px 14px;margin:0 30px 14px 0;background:white}.message.user{margin:0 0 14px 30px;background:#e5edf8}.message small{display:block;color:#7d8794;font-size:11px}.empty{color:#81838a;line-height:1.8;text-align:center;margin-top:20vh}footer{padding:12px 16px 16px;background:#fff;border-top:1px solid #e7e4df}textarea{width:100%;resize:none;border:1px solid #dfe3e9;border-radius:12px;padding:12px;line-height:1.5;min-height:84px}.actions{display:flex;gap:8px;margin-top:10px}#send{margin-left:auto;background:#526fa5;color:white}#status{min-height:22px;font-size:12px;color:#69778c;margin-bottom:6px}button:focus-visible,textarea:focus-visible{outline:2px solid #6281bd;outline-offset:2px}</style>
<header><strong>伙伴聊天</strong><button id="new">新对话</button></header>
<main id="messages" aria-live="polite"></main><footer><div id="status" role="status"></div><textarea id="input" aria-label="聊天内容" placeholder="想聊些什么？"></textarea><div class="actions"><button id="record">录音</button><button id="stop">停止</button><button id="send">发送</button></div></footer><script type="module" src="/desktop-pet/chat.js"></script></html>
