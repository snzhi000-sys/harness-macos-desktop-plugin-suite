<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1600, initial-scale=1">
  <title>Harness for macOS</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1600px; height: 900px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 78% 4%, rgba(96, 165, 250, .30), transparent 31%),
        radial-gradient(circle at 4% 74%, rgba(45, 212, 191, .16), transparent 32%),
        linear-gradient(145deg, #07111f 0%, #0b1930 54%, #10284a 100%);
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .19;
      background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, black, transparent 68%);
    }
    .header { position: relative; z-index: 2; padding: 72px 104px 0; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #bfdbfe;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .18em;
    }
    .eyebrow::before { content: ""; width: 34px; height: 4px; border-radius: 4px; background: #60a5fa; }
    h1 { margin: 20px 0 10px; font-size: 76px; line-height: 1; letter-spacing: -.045em; }
    .lead { margin: 0; color: #dbeafe; font-size: 31px; font-weight: 600; letter-spacing: -.02em; }
    .description { margin: 16px 0 0; color: #9fb4d0; font-size: 21px; }
    .chips { display: flex; gap: 12px; margin-top: 25px; }
    .chip {
      padding: 9px 15px;
      color: #dbeafe;
      font-size: 16px;
      font-weight: 650;
      border: 1px solid rgba(147,197,253,.22);
      border-radius: 999px;
      background: rgba(15, 35, 64, .64);
      box-shadow: inset 0 1px rgba(255,255,255,.05);
    }
    .window {
      position: absolute;
      z-index: 2;
      left: 104px;
      right: 104px;
      top: 395px;
      height: 590px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 24px;
      background: white;
      box-shadow: 0 36px 95px rgba(0,0,0,.48), 0 0 0 8px rgba(255,255,255,.055);
      transform: perspective(1400px) rotateX(2deg);
      transform-origin: center top;
    }
    .window img { display: block; width: 100%; height: auto; }
    .glow {
      position: absolute;
      z-index: 1;
      left: 260px;
      right: 260px;
      top: 505px;
      height: 350px;
      background: rgba(59,130,246,.28);
      filter: blur(95px);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="eyebrow">HARNESS FOR MACOS</div>
    <h1>Harness MacOS 桌面端</h1>
    <p class="lead">把 Agent、文件与审阅放进同一个工作空间</p>
    <p class="description">不在 Codex 与 IDE 之间来回切换，专注完成真正的工作。</p>
    <div class="chips">
      <span class="chip">原生 Explorer</span>
      <span class="chip">文件引用</span>
      <span class="chip">多标签浏览</span>
      <span class="chip">AI 修改审核</span>
      <span class="chip">Web & Media</span>
    </div>
  </header>
  <div class="glow"></div>
  <div class="window"><img src="workbench.png" alt="Harness macOS 工作台"></div>
</body>
</html>
